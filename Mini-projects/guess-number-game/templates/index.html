<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Number Hunt 🔥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0a1f;
    --bg-glow: #1c1440;
    --card: #17122e;
    --card-edge: #2b2354;
    --pink: #ff3ea5;
    --lime: #c6ff3b;
    --cyan: #4deeea;
    --yellow: #ffd23e;
    --text: #f5f3ff;
    --muted: #9c93c7;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, var(--bg-glow), transparent 55%),
      radial-gradient(circle at 85% 90%, #241a4a, transparent 45%),
      var(--bg);
    color: var(--text);
    font-family:'Space Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .wrap{ width:100%; max-width: 460px; }

  .eyebrow{
    text-align:center;
    color: var(--cyan);
    letter-spacing: 0.3em;
    font-size: 12px;
    font-weight:700;
    margin-bottom: 6px;
    text-transform:uppercase;
  }

  h1{
    font-family:'Bungee', system-ui, sans-serif;
    text-align:center;
    font-size: clamp(32px, 8vw, 44px);
    margin: 0 0 6px;
    line-height:1.05;
    background: linear-gradient(90deg, var(--pink), var(--yellow) 60%, var(--lime));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .subtitle{
    text-align:center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 22px;
  }
  .subtitle b{ color: var(--text); }

  .card{
    background: var(--card);
    border: 2px solid var(--card-edge);
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }

  .top-row{
    display:flex;
    align-items:center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .lives{
    display:flex;
    gap:6px;
    flex:1;
  }
  .life{
    width: 26px; height: 26px;
    display:flex; align-items:center; justify-content:center;
    font-size: 18px;
    filter: grayscale(0);
    transition: transform .2s ease, opacity .2s ease, filter .2s ease;
  }
  .life.spent{ opacity:.25; filter: grayscale(1); transform: scale(.85); }

  .newgame-btn{
    border: none;
    background: transparent;
    color: var(--muted);
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight:600;
    letter-spacing:.04em;
    cursor:pointer;
    padding: 8px 10px;
    border-radius: 10px;
    transition: color .15s ease, background .15s ease;
  }
  .newgame-btn:hover{ color: var(--text); background: rgba(255,255,255,.06); }

  .stage{
    display:grid;
    grid-template-columns: 56px 1fr;
    gap: 16px;
    margin-bottom: 18px;
  }

  /* Heat-o-meter */
  .meter-shell{
    background: #0d0a1f;
    border: 2px solid var(--card-edge);
    border-radius: 999px;
    height: 220px;
    position: relative;
    overflow: hidden;
  }
  .meter-fill{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 8%;
    border-radius: 999px;
    background: linear-gradient(0deg, var(--cyan), var(--lime) 45%, var(--yellow) 75%, var(--pink));
    transition: height .5s cubic-bezier(.2,.9,.3,1.3);
  }
  .meter-marker{
    position:absolute;
    left:50%;
    bottom: 8%;
    transform: translate(-50%, 50%);
    font-size: 20px;
    transition: bottom .5s cubic-bezier(.2,.9,.3,1.3);
  }
  .meter-labels{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    height:220px;
    font-size:10px;
    color: var(--muted);
    letter-spacing:.08em;
    font-weight:700;
    text-align:center;
    width:0;
  }

  .board{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  .readout{
    background:#0d0a1f;
    border: 2px solid var(--card-edge);
    border-radius: 16px;
    text-align:center;
    padding: 10px 8px;
    margin-bottom: 10px;
  }
  .readout .num{
    font-family:'Bungee', sans-serif;
    font-size: 42px;
    letter-spacing: .04em;
    min-height: 48px;
    color: var(--text);
  }
  .readout .num.placeholder{ color: var(--muted); }
  .readout .range{ font-size: 11px; color: var(--muted); letter-spacing:.08em; }

  .hint-line{
    min-height: 20px;
    text-align:center;
    font-weight:700;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .hint-line.cold{ color: var(--cyan); }
  .hint-line.warm{ color: var(--yellow); }
  .hint-line.win{ color: var(--lime); }
  .hint-line.lose{ color: var(--pink); }

  .history{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    min-height: 26px;
  }
  .chip{
    font-size: 11px;
    font-weight:700;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--card-edge);
    padding: 4px 8px;
    border-radius: 999px;
    color: var(--muted);
  }

  .keypad{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .key{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 20px;
    padding: 16px 0;
    border-radius: 14px;
    border: 2px solid var(--card-edge);
    background: #1e1840;
    color: var(--text);
    cursor:pointer;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .key:active{ transform: scale(.94); }
  .key:hover{ border-color: var(--cyan); }

  .key.clear{ color: var(--pink); }
  .key.enter{
    background: linear-gradient(90deg, var(--pink), var(--yellow));
    color: #0d0a1f;
    border: none;
  }
  .key:disabled{ opacity:.35; cursor:not-allowed; transform:none; }

  .footer-note{
    text-align:center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 16px;
  }

  /* win overlay confetti */
  .confetti-piece{
    position: fixed;
    top: -12px;
    width: 8px; height: 14px;
    opacity: .95;
    animation: fall linear forwards;
    z-index: 50;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    .meter-fill, .meter-marker{ transition:none; }
    .confetti-piece{ animation: none; display:none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">local co-op &middot; two player brains, one number</div>
  <h1>NUMBER HUNT</h1>
  <p class="subtitle">Secret number's hiding between <b>{{ low }}</b> and <b>{{ high }}</b>. You get <b>{{ max_attempts }}</b> shots. Go.</p>

  <div class="card">
    <div class="top-row">
      <div class="lives" id="lives"></div>
      <button class="newgame-btn" id="newGameBtn">↻ NEW GAME</button>
    </div>

    <div class="stage">
      <div>
        <div class="meter-shell">
          <div class="meter-fill" id="meterFill"></div>
          <div class="meter-marker" id="meterMarker">🧊</div>
        </div>
      </div>
      <div class="board">
        <div>
          <div class="readout">
            <div class="num placeholder" id="numDisplay">--</div>
            <div class="range">{{ low }} – {{ high }}</div>
          </div>
          <div class="hint-line" id="hintLine">&nbsp;</div>
          <div class="history" id="history"></div>
        </div>
      </div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key clear" id="clearBtn">CLR</button>
      <button class="key" data-num="0">0</button>
      <button class="key enter" id="enterBtn">GO</button>
    </div>
  </div>

  <p class="footer-note">🔥 = getting close &nbsp;&middot;&nbsp; 🧊 = ice cold &nbsp;&middot;&nbsp; running local on your machine</p>
</div>

<script>
const MAX_ATTEMPTS = {{ max_attempts }};
const LOW = {{ low }};
const HIGH = {{ high }};

const livesEl = document.getElementById('lives');
const numDisplay = document.getElementById('numDisplay');
const hintLine = document.getElementById('hintLine');
const historyEl = document.getElementById('history');
const meterFill = document.getElementById('meterFill');
const meterMarker = document.getElementById('meterMarker');
const keypad = document.getElementById('keypad');
const enterBtn = document.getElementById('enterBtn');
const clearBtn = document.getElementById('clearBtn');
const newGameBtn = document.getElementById('newGameBtn');

let current = "";
let gameOver = false;

function renderLives(attemptsUsed){
  livesEl.innerHTML = "";
  for(let i=0;i<MAX_ATTEMPTS;i++){
    const d = document.createElement('div');
    d.className = 'life' + (i < attemptsUsed ? ' spent' : '');
    d.textContent = '⭐';
    livesEl.appendChild(d);
  }
}

function renderDisplay(){
  if(current === ""){
    numDisplay.textContent = "--";
    numDisplay.classList.add('placeholder');
  } else {
    numDisplay.textContent = current;
    numDisplay.classList.remove('placeholder');
  }
}

function setMeter(diff){
  // diff 0 -> 100% (hot), diff 99 -> ~4% (cold)
  const maxDiff = HIGH - LOW;
  const pct = Math.max(4, Math.min(100, 100 - (diff / maxDiff) * 96));
  meterFill.style.height = pct + '%';
  meterMarker.style.bottom = pct + '%';
  meterMarker.textContent = pct > 66 ? '🔥' : (pct > 30 ? '😅' : '🧊');
}

function hintText(hint){
  switch(hint){
    case 'warm_low': return {text:'🔥 warm... go higher', cls:'warm'};
    case 'warm_high': return {text:'🔥 warm... go lower', cls:'warm'};
    case 'cold_low': return {text:'🧊 cold, way higher', cls:'cold'};
    case 'cold_high': return {text:'🧊 cold, way lower', cls:'cold'};
    case 'boom': return {text:'🏆 YOU FOUND IT!', cls:'win'};
    case 'over': return {text:'💀 out of shots', cls:'lose'};
    default: return {text:'', cls:''};
  }
}

function addHistoryChip(guess, hint){
  const chip = document.createElement('div');
  chip.className = 'chip';
  const emoji = hint === 'boom' ? '🏆' : (hint.startsWith('warm') ? '🔥' : '🧊');
  chip.textContent = `${emoji} ${guess}`;
  historyEl.appendChild(chip);
}

function launchConfetti(){
  const colors = ['#ff3ea5', '#c6ff3b', '#4deeea', '#ffd23e'];
  for(let i=0;i<60;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (2 + Math.random()*1.5) + 's';
    p.style.animationDelay = (Math.random()*0.4) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

function setKeypadEnabled(enabled){
  [...keypad.querySelectorAll('button')].forEach(b => b.disabled = !enabled);
}

async function loadState(){
  const res = await fetch('/api/state');
  const data = await res.json();
  renderLives(data.attempts_used);
  historyEl.innerHTML = "";
  data.history.forEach(h => addHistoryChip(h.guess, h.hint));
  gameOver = data.over;
  setKeypadEnabled(!gameOver);
  if(gameOver){
    hintLine.textContent = "Game's done — hit NEW GAME to go again";
    hintLine.className = 'hint-line';
  }
}

keypad.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn || btn.disabled) return;

  if(btn === clearBtn){
    current = "";
    renderDisplay();
    return;
  }
  if(btn === enterBtn){
    submitGuess();
    return;
  }
  const num = btn.dataset.num;
  if(num !== undefined){
    if(current.length >= 3) return;
    const next = current + num;
    if(Number(next) > HIGH) return;
    current = next;
    renderDisplay();
  }
});

document.addEventListener('keydown', (e) => {
  if(gameOver) return;
  if(e.key >= '0' && e.key <= '9'){
    if(current.length >= 3) return;
    const next = current + e.key;
    if(Number(next) > HIGH) return;
    current = next;
    renderDisplay();
  } else if(e.key === 'Enter'){
    submitGuess();
  } else if(e.key === 'Backspace'){
    current = current.slice(0, -1);
    renderDisplay();
  }
});

async function submitGuess(){
  if(current === "" || gameOver) return;
  const guess = Number(current);
  if(guess < LOW || guess > HIGH) return;

  setKeypadEnabled(false);
  const res = await fetch('/api/guess', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({guess})
  });
  const data = await res.json();

  if(data.error){
    hintLine.textContent = data.error;
    hintLine.className = 'hint-line lose';
    setKeypadEnabled(true);
    return;
  }

  setMeter(data.diff);
  addHistoryChip(guess, data.hint);
  renderLives(data.attempts_used);

  const h = hintText(data.hint);
  hintLine.textContent = h.text;
  hintLine.className = 'hint-line ' + h.cls;

  current = "";
  renderDisplay();

  if(data.result === 'win'){
    gameOver = true;
    launchConfetti();
    setKeypadEnabled(false);
  } else if(data.result === 'lose'){
    gameOver = true;
    hintLine.textContent = `💀 So close! It was ${data.secret}`;
    hintLine.className = 'hint-line lose';
    setKeypadEnabled(false);
  } else {
    setKeypadEnabled(true);
  }
}

newGameBtn.addEventListener('click', async () => {
  await fetch('/api/new-game', {method:'POST'});
  current = "";
  gameOver = false;
  hintLine.textContent = "";
  hintLine.className = 'hint-line';
  historyEl.innerHTML = "";
  meterFill.style.height = '8%';
  meterMarker.style.bottom = '8%';
  meterMarker.textContent = '🧊';
  renderDisplay();
  renderLives(0);
  setKeypadEnabled(true);
});

renderDisplay();
loadState();
</script>

</body>
</html>
